name: Release MG Sao Luu v1.2.1

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/release-v1.2.1.yml

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TARGET_SHA: 364e06301c4a8603412f3a548bfba04eecccdb78
      EXPECTED_ZIP_SHA256: f7c7fd61e4db51c22f66b0abf328af6c3efa114c88f461f15132010aa72ef85b
      RELEASE_TAG: v1.2.1
      RELEASE_ZIP: mg-saoluu-v1.2.1.zip

    steps:
      - name: Checkout exact Stable release tree
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0

      - name: Verify exact release commit
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          grep -F "* Version: 1.2.1" mg-saoluu.php
          grep -F "define('MG_SAOLUU_VERSION', '1.2.1')" mg-saoluu.php

      - name: Build and verify final Stable ZIP
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/$RELEASE_ZIP"
          sh scripts/verify_rc3_release.sh "$OUT"
          ACTUAL="$(sha256sum "$OUT" | awk '{print $1}')"
          echo "ZIP_SHA256=$ACTUAL"
          test "$ACTUAL" = "$EXPECTED_ZIP_SHA256"

      - name: Create exact tag and GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; refusing to replace it."
            exit 1
          fi

          cat > "$RUNNER_TEMP/release-notes.md" <<'EOF'
          ## MG Sao Lưu v1.2.1

          Stable Backup/Restore release after RC9 runtime acceptance on an isolated WordPress/database clone.

          ### Release evidence
          - Exact source SHA: `364e06301c4a8603412f3a548bfba04eecccdb78`
          - ZIP SHA-256: `f7c7fd61e4db51c22f66b0abf328af6c3efa114c88f461f15132010aa72ef85b`
          - Integrity: 28/28 PASS
          - Contract: 113/113 PASS
          - Unsafe config: 4/4 PASS
          - Schedule health: 15/15 PASS
          - Restore → explicit Rollback: runtime PASS on isolated clone
          - Negative runtime gates PASS: wrong key, corrupt/duplicate ZIP, wrong prefix, symlink leaf/ancestor, missing CLI, simulated low disk, lock contention
          - Interrupted import was not force-injected because no safe deterministic mechanism exists.

          ### Scope
          Backup, Verify, Store and controlled Restore only. Data Transfer/Deploy remain disabled.

          Production restore is same-host disaster recovery only and remains protected by source-host/environment matching, manifest signature, paired Local signed 10-minute approval, administrator password, host/phrase confirmation, integrity/preflight checks and a pre-restore rollback checkpoint.
          EOF

          gh release create "$RELEASE_TAG" "$RUNNER_TEMP/$RELEASE_ZIP#$RELEASE_ZIP"             --repo "$GITHUB_REPOSITORY"             --target "$TARGET_SHA"             --title "MG Sao Lưu v1.2.1"             --notes-file "$RUNNER_TEMP/release-notes.md"

      - name: Verify published tag and asset
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG_SHA="$(git ls-remote "https://github.com/$GITHUB_REPOSITORY.git" "refs/tags/$RELEASE_TAG" | awk '{print $1}')"
          test "$TAG_SHA" = "$TARGET_SHA"
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json tagName,isDraft,isPrerelease,name             --jq '.tagName + " | " + .name + " | draft=" + (.isDraft|tostring) + " | prerelease=" + (.isPrerelease|tostring)'
